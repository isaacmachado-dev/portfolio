<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vapor esquerdo -->
  <path d="M 6 2 C 6 2 6 4 6 4">
    <animate 
      attributeName="d" 
      values="M 6 2 C 6 2 6 4 6 4; M 6 2 C 5.1 2.5 5.0 3.5 6 4; M 6 2 C 6 2 6 4 6 4" 
      dur="2s" 
      repeatCount="indefinite" 
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -1; 0 0"
      dur="2s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Vapor central -->
  <path d="M 10 2 C 10 2 10 4 10 4">
    <animate 
      attributeName="d" 
      values="M 10 2 C 10 2 10 4 10 4; M 10 2 C 10.6 2.5 10.6 3.5 10 4; M 10 2 C 10 2 10 4 10 4" 
      dur="2s" 
      begin="0.3s"
      repeatCount="indefinite" 
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -1.2; 0 0"
      dur="2s"
      begin="0.3s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Vapor direito -->
  <path d="M 14 2 C 14 2 14 4 14 4">
    <animate 
      attributeName="d" 
      values="M 14 2 C 14 2 14 4 14 4; M 14 2 C 12.8 2.5 12.8 3.5 14 4; M 14 2 C 14 2 14 4 14 4" 
      dur="2s" 
      begin="0.6s"
      repeatCount="indefinite" 
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -1; 0 0"
      dur="2s"
      begin="0.6s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Caneca e Alça perfeita do Lucide Icons -->
  <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
</svg>